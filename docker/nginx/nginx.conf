# КЭБИНЕТ + АДМИНКА: поддомен кабинета. Смени cab.nyxvps.space на реальный поддомен,
# на который указывает A-запись → IP сервера. После смены перезапусти nginx и перевыпусти cert.

# HTTP: только ACME и редирект на HTTPS
server {
    listen 80;
    server_name cab.nyxvps.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cab.nyxvps.space;

    ssl_certificate     /etc/letsencrypt/live/cab.nyxvps.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cab.nyxvps.space/privkey.pem;

    # Uvicorn на admin:8001. 127.0.0.1 + expose => без TLS наружу не торчит.
    location / {
        proxy_pass http://admin:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;
}
